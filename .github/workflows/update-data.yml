# 한국부동산원 R-ONE 오픈API(주간 매매가격지수)와 청약홈 오픈API(분양정보)에서
# 데이터를 받아 data/ 를 갱신하고 커밋한다.
# main 에 푸시되면 Vercel 이 자동으로 재배포한다 (Vercel 프로젝트가 이 리포에 연결돼 있어야 함).
#
# 필요한 설정: 리포 Settings › Secrets and variables › Actions 에
#   RONE_API_KEY      (필수) — 주간 매매가격지수
#   CHEONGYAK_API_KEY (선택) — 청약 예정 정보. 없으면 청약 표시만 빠진다.
#   DATA_GO_KR_API_KEY (선택) — 강동구 상세(실거래가/K-APT). 없으면 CHEONGYAK_API_KEY를 재사용한다.
name: 데이터 갱신

on:
  # 강동구 상세 파이프라인 최초 검증용 일시적 트리거. 실행 확인 후 제거.
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    # 부동산원 공표는 매주 목요일 정오(KST).
    # GitHub Actions의 정각 혼잡을 피하도록 목 14:17 KST에 받고, 금 10:23 KST에 한 번 더 시도한다.
    - cron: "17 5 * * 4"
    - cron: "23 1 * * 5"
  workflow_dispatch: # 수동 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fetch_data.py 는 표준 라이브러리만 쓰므로 의존성 설치가 없다.
      - name: 데이터 수신
        env:
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
        run: |
          if [ -z "$RONE_API_KEY" ]; then
            echo "::error::RONE_API_KEY 시크릿이 없습니다. Settings › Secrets and variables › Actions 에서 등록하세요."
            exit 1
          fi
          python scripts/fetch_data.py

      # 청약홈은 부가 정보라, 키가 없으면 경고만 남기고 매매 데이터 갱신은 그대로 진행한다.
      - name: 청약 정보 수신
        env:
          CHEONGYAK_API_KEY: ${{ secrets.CHEONGYAK_API_KEY }}
        run: |
          if [ -z "$CHEONGYAK_API_KEY" ]; then
            echo "::warning::CHEONGYAK_API_KEY 시크릿이 없어 청약 정보를 건너뜁니다. Settings › Secrets and variables › Actions 에서 등록하세요."
            exit 0
          fi
          python scripts/fetch_cheongyak.py

      # 강동구 파일럿: 법정동별 대표 아파트와 최근 실거래가.
      # 공공데이터포털 인증키는 공통이지만 실거래가/K-APT 각 서비스 활용신청이 별도로 필요하다.
      - name: 강동구 상세 아파트 데이터 수신
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          CHEONGYAK_API_KEY: ${{ secrets.CHEONGYAK_API_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_API_KEY" ] && [ -z "$CHEONGYAK_API_KEY" ]; then
            echo "::warning::공공데이터포털 인증키가 없어 강동구 상세 데이터를 건너뜁니다."
            exit 0
          fi
          python scripts/fetch_gangdong_detail.py --months 24

      # 앞 단계가 실패해도, 이미 받아 둔 변경분은 커밋한다.
      - name: 변경분 커밋
        if: always()
        run: |
          if git diff --quiet -- data; then
            echo "새 주차 없음 — 커밋할 변경이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "데이터 갱신: $(date -u +%Y-%m-%d)"
          git push
