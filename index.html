<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아파트 바로맵 | 서울 부동산 바로미터 지도</title>
<meta name="description" content="서울 25개 자치구의 주간 아파트 매매가격 흐름과 청약 일정을 한눈에 보는 부동산 바로미터 지도">
<meta property="og:type" content="website">
<meta property="og:title" content="아파트 바로맵">
<meta property="og:description" content="서울 부동산의 주간 가격 흐름과 청약 정보를 한눈에 보는 부동산 바로미터 지도">
<meta name="twitter:card" content="summary">

<!-- 사이트 설정(GA4 측정 ID)은 config.js, 로더는 analytics.js — 5개 사이트 공통 규격 -->
<script src="config.js"></script>
<script src="analytics.js"></script>

<style>
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --up-strong: #a52a24;
    --down-strong: #184f95;
    --series-gu: #2a78d6;
    --series-seoul: #898781;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 30px; }

  header { margin-bottom: 10px; }
  header .brand-row {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 5px;
  }
  header h1 { font-size: 27px; font-weight: 850; margin: 0; letter-spacing: -0.035em; line-height: 1.12; }
  header .tagline {
    margin: 0; color: var(--ink-2); font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
  }
  header .sub { color: var(--muted); font-size: 11.5px; margin: 0; line-height: 1.6; }
  header .sub b { font-weight: 700; color: var(--ink-2); }
  @media (max-width: 640px) {
    .wrap { padding: 12px 8px 24px; }
    header { padding: 0 4px; margin-bottom: 8px; }
    header .brand-row { gap: 7px; margin-bottom: 4px; }
    header h1 { font-size: 24px; }
    header .tagline { font-size: 12px; }
    header .sub { font-size: 10.8px; }
  }

  .sample-note {
    margin: 14px 0 0; padding: 10px 14px; border-radius: 10px;
    background: #fdf3e2; border: 1px solid #f0d9ac; color: #6b4e12; font-size: 13px;
  }
  .sample-note code { background: rgba(11,11,11,.06); padding: 1px 5px; border-radius: 4px; }

  .topbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 16px; min-width: 130px;
  }
  .stat .k { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .stat .v { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .chip {
    font-size: 12.5px; color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
  }
  .chip b { color: var(--ink); }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; position: relative;
  }
  @media (max-width: 640px) {
    .card { padding: 9px; border-radius: 12px; }
    .card-head { gap: 8px; }
  }
  .card + .card { margin-top: 14px; }
  .card-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .card-title { font-size: 15px; font-weight: 700; }
  .card-title .hint { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; }

  .legend { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .legend-scale { display: flex; flex-direction: column; }
  .legend-cells { display: flex; }
  .legend-cells span { width: 34px; height: 12px; }
  .legend-cells span:first-child { border-radius: 3px 0 0 3px; }
  .legend-cells span:last-child { border-radius: 0 3px 3px 0; }
  .legend-ticks { display: flex; font-size: 10px; color: var(--muted); }
  .legend-ticks span { width: 34px; text-align: right; transform: translateX(8px); }
  .legend-label { font-size: 11px; color: var(--ink-2); margin-bottom: 3px; }
  .legend-missing { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); padding-bottom: 14px; }
  .legend-missing svg { border-radius: 3px; border: 1px solid var(--hairline); }

  .view-toggle, .range-toggle { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .view-toggle button, .range-toggle button {
    border: 0; background: transparent; padding: 6px 14px; font-size: 12.5px; cursor: pointer;
    color: var(--ink-2); font-family: inherit;
  }
  .view-toggle button[aria-pressed="true"], .range-toggle button[aria-pressed="true"] {
    background: var(--ink); color: #fff; font-weight: 600;
  }

  .map-layout {
    --detail-width: 310px;
    display: block; margin-top: 6px; min-width: 0;
  }
  #map-box { position: relative; width: 100%; min-width: 0; overflow: hidden; border-radius: 10px; }
  #map {
    width: 100%; height: auto; display: block;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  #map.pannable { cursor: grab; touch-action: none; }
  #map.panning { cursor: grabbing; }
  .gu {
    stroke: var(--surface); stroke-width: calc(1.6px / var(--k, 1)); cursor: pointer;
    transition: filter .1s ease;
  }
  .gu:focus { outline: none; }
  .gu:hover, .gu:focus-visible {
    filter: brightness(0.93); outline: none; stroke: var(--ink);
    stroke-width: calc(1.2px / var(--k, 1));
  }
  .gu.selected { stroke: var(--ink); stroke-width: calc(2px / var(--k, 1)); }

  .map-zoom {
    position: absolute; z-index: 2; display: flex; gap: 5px;
    right: 8px; bottom: 8px; flex-direction: row;
  }
  .map-zoom button {
    width: 42px; height: 42px; padding: 0;
    border: 1px solid var(--border); border-radius: 10px;
    background: rgba(252,252,251,.94); color: var(--ink);
    font: inherit; font-size: 18px; line-height: 1; font-weight: 650;
    cursor: pointer; box-shadow: 0 1px 5px rgba(11,11,11,.12); backdrop-filter: blur(5px);
  }
  .map-zoom button:hover:not(:disabled) { background: #f2f1ec; }
  .map-zoom button:disabled { opacity: .35; cursor: default; }
  .map-hint { margin: 5px 2px 0; color: var(--muted); font-size: 10.8px; line-height: 1.45; }
  .map-hint .desktop-hint { display: none; }
  #location-status:not(:empty)::before { content: " · "; }
  .location-marker { pointer-events: none; }

  .district-panel {
    margin-top: 9px; padding: 13px 12px 11px;
    border: 1px solid var(--hairline); border-radius: 12px;
    background: #f8f8f5; overflow: hidden;
  }
  .district-panel[data-open="false"] { display: none; }
  .district-panel[data-open="true"] { display: block; animation: detail-rise .18s ease-out; }
  @keyframes detail-rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .district-panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px;
  }
  .district-panel .panel-cap {
    color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; margin: 0;
  }
  .panel-close {
    width: 32px; height: 32px; border: 0; border-radius: 8px; padding: 0;
    background: transparent; color: var(--muted); font: inherit; font-size: 20px;
    cursor: pointer; line-height: 1;
  }
  .panel-close:hover, .panel-close:focus-visible { background: var(--hairline); color: var(--ink); outline: none; }
  .district-panel .district-summary {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
    margin-bottom: 8px;
  }
  .district-panel .district-summary-main { min-width: 82px; flex: 1 1 auto; }
  .district-panel .tt-name { font-weight: 800; font-size: 18px; margin-bottom: 2px; }
  .district-panel .tt-now { font-size: 26px; font-weight: 850; margin-bottom: 0; }
  .district-panel .district-summary .tt-spark { flex: 0 0 auto; margin: 0; }
  .district-panel table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .district-panel td { padding: 2px 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .district-panel td:last-child { text-align: right; color: var(--ink); }
  .district-panel .tt-bar { height: 4px; border-radius: 2px; margin-left: 6px; display: inline-block; vertical-align: middle; }
  .district-panel .tt-spark { margin: 5px 0 10px; }
  .district-panel .tt-spark-cap { font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
  .district-panel .tt-cy { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--hairline); }
  .district-panel .tt-cy-cap { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; }
  .district-panel .tt-cy td { vertical-align: top; padding: 3px 0; }
  .district-panel .tt-cy td:first-child { color: var(--ink); font-weight: 600; padding-right: 8px; }
  .district-panel .tt-cy .tt-sub { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .district-panel .tt-cy .tt-flag {
    display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 999px;
    font-size: 9.5px; font-weight: 650; background: var(--hairline); color: var(--ink-2);
  }
  .district-panel .tt-cy .tt-flag.on { background: #1f7a4d; color: #fff; }
  .district-panel .tt-cy .tt-more { color: var(--muted); font-size: 10.5px; margin-top: 3px; }

  /* 모바일: 지도 최대 폭 + 큰 터치 버튼 + 상세정보는 지도 바로 아래 */
  @media (max-width: 599px) {
    .map-layout { margin-top: 4px; }
    #map-box { border-radius: 8px; }
    .map-zoom { right: 6px; bottom: 6px; gap: 4px; }
    .map-zoom button { width: 40px; height: 40px; border-radius: 9px; font-size: 17px; }
    .district-panel { margin-top: 7px; padding: 11px 9px 9px; }
    .district-panel .tt-name { font-size: 17px; }
    .district-panel .tt-now { font-size: 23px; }
  }

  /* 태블릿: 지도는 계속 전체 폭, 상세정보는 하단 카드 */
  @media (min-width: 600px) and (max-width: 1023px) {
    .map-zoom { right: 9px; bottom: 9px; }
    .map-zoom button { width: 44px; height: 44px; }
    .district-panel { margin-top: 10px; padding: 14px 16px 12px; }
  }

  /* 랩탑/데스크탑: 선택 시 지도 우측으로 상세 패널이 슬라이드 아웃 */
  @media (min-width: 1024px) {
    .map-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 0;
      gap: 0;
      align-items: stretch;
      transition: grid-template-columns .22s ease, column-gap .22s ease;
    }
    .map-layout.has-selection {
      grid-template-columns: minmax(0, 1fr) var(--detail-width);
      column-gap: 14px;
    }
    .district-panel,
    .district-panel[data-open="false"],
    .district-panel[data-open="true"] {
      display: block;
      margin: 0; padding: 14px 0 12px 16px;
      border: 0; border-left: 1px solid var(--hairline);
      border-radius: 0; background: transparent;
      opacity: 0; transform: translateX(18px);
      pointer-events: none; min-width: 0;
      transition: opacity .18s ease, transform .22s ease;
      animation: none;
    }
    .map-layout.has-selection .district-panel {
      opacity: 1; transform: translateX(0); pointer-events: auto;
    }
    .map-zoom { top: 8px; right: 8px; bottom: auto; flex-direction: column; }
    .map-zoom button { width: 34px; height: 34px; border-radius: 8px; font-size: 16px; }
    .map-hint .touch-hint { display: none; }
    .map-hint .desktop-hint { display: inline; }
  }

  /* 큰 데스크탑에서는 정보 패널을 조금 넓게, 전체 콘텐츠 폭도 활용 */
  @media (min-width: 1440px) {
    .wrap { max-width: 1320px; }
    .map-layout { --detail-width: 340px; }
    .map-layout.has-selection { column-gap: 18px; }
  }

  .gu-label { pointer-events: none; text-anchor: middle; }
  .gu-label .nm { font-size: 13px; font-weight: 700; }
  .gu-label .val { font-size: 11px; font-weight: 500; }
  .gu-label .bdg-t { font-size: 10px; font-weight: 700; }

  #tooltip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(11,11,11,.12); padding: 10px 12px; min-width: 190px; font-size: 12.5px;
  }
  #tooltip .tt-name { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  #tooltip .tt-now { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  #tooltip table { border-collapse: collapse; width: 100%; }
  #tooltip td { padding: 1.5px 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #tooltip td:last-child { text-align: right; color: var(--ink); }
  #tooltip .tt-bar { height: 4px; border-radius: 2px; margin-left: 8px; display: inline-block; vertical-align: middle; }
  #tooltip .tt-spark { margin: 4px 0 6px; }
  #tooltip .tt-spark-cap { font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
  #tooltip .tt-cy { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--hairline); }
  #tooltip .tt-cy-cap { font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  #tooltip .tt-cy td { vertical-align: top; }
  #tooltip .tt-cy td:first-child { color: var(--ink); font-weight: 600; padding-right: 10px; }
  #tooltip .tt-cy .tt-sub { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  #tooltip .tt-cy .tt-flag {
    display: inline-block; margin-left: 5px; padding: 0 5px; border-radius: 999px;
    font-size: 10px; font-weight: 600; background: var(--hairline); color: var(--ink-2);
  }
  #tooltip .tt-cy .tt-flag.on { background: #1f7a4d; color: #fff; }
  #tooltip .tt-cy .tt-more { color: var(--muted); font-size: 11px; margin-top: 3px; }

  #table-view { display: none; margin-top: 8px; overflow-x: auto; }
  #table-view table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #table-view th {
    text-align: right; font-weight: 600; color: var(--muted); font-size: 11.5px;
    border-bottom: 1px solid var(--hairline); padding: 8px 10px;
  }
  #table-view th:first-child, #table-view td:first-child { text-align: left; }
  #table-view td { padding: 7px 10px; border-bottom: 1px solid var(--hairline); text-align: right; font-variant-numeric: tabular-nums; }
  #table-view td.swatch-cell { text-align: left; white-space: nowrap; color: var(--ink); }
  .trend-up { color: var(--up-strong); font-weight: 700; }
  .trend-down { color: var(--down-strong); font-weight: 700; }
  .trend-flat { color: var(--muted); font-weight: 600; }
  #table-view .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; border: 1px solid rgba(11,11,11,.08); }

  #chart-box { margin-top: 10px; position: relative; }
  #chart { width: 100%; height: auto; display: block; }
  #chart-tip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: 0 6px 20px rgba(11,11,11,.12); padding: 8px 11px; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  #chart-tip .w { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  #chart-tip .r { display: flex; gap: 10px; justify-content: space-between; }
  #chart-tip .r .lg { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
  #chart-tip .r .lg i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chart-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
  .chart-legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: 2px; }
  .range-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .custom-range {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 11px; color: var(--muted);
  }
  .custom-range[hidden] { display: none; }
  .custom-range label { display: flex; align-items: center; gap: 4px; }
  .custom-range input {
    border: 1px solid var(--border); border-radius: 7px; background: var(--surface);
    color: var(--ink-2); font: inherit; font-size: 11.5px; padding: 5px 6px;
  }
  .custom-range button {
    border: 1px solid var(--border); border-radius: 7px; background: var(--ink);
    color: #fff; font: inherit; font-size: 11.5px; padding: 5px 9px; cursor: pointer;
  }
  @media (max-width: 640px) {
    .range-controls { width: 100%; align-items: stretch; }
    .range-toggle { align-self: flex-start; }
    .custom-range { justify-content: flex-start; }
    .custom-range input { max-width: 125px; }
  }

  footer { margin-top: 10px; color: var(--muted); font-size: 10.8px; line-height: 1.45; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand-row">
      <h1>아파트 바로맵</h1>
      <p class="tagline">서울 부동산 바로미터 지도</p>
    </div>
    <p class="sub" id="subtitle"></p>
  </header>
  <div id="sample-banner"></div>

  <div class="topbar">
    <div class="stat">
      <div class="k">서울 부동산 바로미터 · 전주 대비</div>
      <div class="v" id="seoul-stat">–</div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="legend">
        <div class="legend-scale">
          <div class="legend-label">주간 매매가격 변동률 (%)</div>
          <div class="legend-cells" id="legend-cells"></div>
          <div class="legend-ticks" id="legend-ticks"></div>
        </div>
      </div>
      <div class="view-toggle" role="group" aria-label="보기 전환">
        <button type="button" id="btn-map" aria-pressed="true">지도</button>
        <button type="button" id="btn-table" aria-pressed="false">표</button>
      </div>
    </div>

    <div class="map-layout" id="map-layout">
      <div id="map-box">
        <svg id="map" role="img" aria-label="서울 자치구별 주간 아파트 매매가격 변동률 지도"></svg>
        <div class="map-zoom" role="group" aria-label="지도 확대와 축소">
          <button type="button" id="zoom-in" aria-label="지도 확대" title="확대">＋</button>
          <button type="button" id="zoom-out" aria-label="지도 축소" title="축소">－</button>
          <button type="button" id="zoom-reset" aria-label="지도 원래 배율" title="원래 배율">⟲</button>
          <button type="button" id="locate-me" aria-label="현재 위치로 이동" title="내 위치">◎</button>
        </div>
        <p class="map-hint">
          <span class="touch-hint">좌우 드래그로 이동 · 핀치 또는 +/−로 확대</span>
          <span class="desktop-hint">드래그로 이동 · 휠 또는 +/−로 확대 · 더블클릭 확대</span>
          <span id="location-status"></span>
        </p>
      </div>
      <aside id="district-panel" class="district-panel" aria-live="polite" aria-hidden="true" data-open="false"></aside>
    </div>
    <div id="table-view"></div>
  </div>

  <div class="card" id="chart-card">
    <div class="card-head">
      <div class="card-title">매매가격지수 추이 <span class="hint">지도에서 자치구를 클릭하면 바뀝니다 · 구간 시작 = 100 재기준</span></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div class="chart-legend" id="chart-legend"></div>
        <div class="range-controls">
          <div class="range-toggle" role="group" aria-label="기간 선택" id="range-toggle">
            <button type="button" data-range="1y">1년</button>
            <button type="button" data-range="2024" aria-pressed="true">2024~</button>
            <button type="button" data-range="all">전체</button>
            <button type="button" id="custom-range-toggle" aria-expanded="false">기간 지정</button>
          </div>
          <div class="custom-range" id="custom-range" hidden>
            <label>시작 <input type="date" id="range-start"></label>
            <span>~</span>
            <label>종료 <input type="date" id="range-end"></label>
            <button type="button" id="apply-range">적용</button>
          </div>
        </div>
      </div>
    </div>
    <div id="chart-box"><svg id="chart" role="img" aria-label="매매가격지수 시계열 차트"></svg></div>
  </div>

  <footer id="footer"></footer>
</div>

<div id="tooltip"></div>
<div id="chart-tip"></div>

<script src="data/seoul_geo.js"></script>
<script src="data/latest.js"></script>
<script src="data/cheongyak.js"></script>
<script src="data/dong_geo/gangdong.js"></script>
<script src="data/gangdong_detail.js"></script>
<script src="district_detail.js"></script>
<script>
(function () {
  const D = window.APT_DATA, GEO = window.SEOUL_GEO;
  const CY = window.CHEONGYAK || { regions: {} };
  const cyToday = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
  const cyOf = g => (CY.regions[g] || []).filter(c => !c.end || c.end >= cyToday);
  const cyTotal = Object.keys(CY.regions || {}).reduce((n, g) => n + cyOf(g).length, 0);
  // 청약 항목은 외부 API 문자열이므로 innerHTML 삽입 전에 이스케이프한다.
  const esc = v => String(v == null ? "" : v)
    .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NEUTRAL = "#f0efec";
  // 상승(빨강)/하락(파랑) diverging — 팔레트 검증기 통과 ramp
  const BINS = [
    { lt: -0.40, fill: "#184f95", ink: "#ffffff", label: "-0.40 이하" },
    { lt: -0.25, fill: "#2a78d6", ink: "#ffffff", label: "-0.40 ~ -0.25" },
    { lt: -0.10, fill: "#6da7ec", ink: "#0b0b0b", label: "-0.25 ~ -0.10" },
    { lt: -0.02, fill: "#b7d3f6", ink: "#0b0b0b", label: "-0.10 ~ -0.02" },
    { lt:  0.02, fill: NEUTRAL,   ink: "#0b0b0b", label: "보합" },
    { lt:  0.10, fill: "#f6c3bd", ink: "#0b0b0b", label: "+0.02 ~ +0.10" },
    { lt:  0.25, fill: "#ee8f85", ink: "#0b0b0b", label: "+0.10 ~ +0.25" },
    { lt:  0.40, fill: "#dd4a41", ink: "#ffffff", label: "+0.25 ~ +0.40" },
    { lt: Infinity, fill: "#a52a24", ink: "#ffffff", label: "+0.40 이상" },
  ];
  const binOf = v => v == null ? null : BINS.find(b => v < b.lt) || BINS[BINS.length - 1];
  const fmt = v => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(2);
  // 이벤트 전송은 analytics.js 의 공통 헬퍼로 위임 (GA 미설정 시 무동작)
  const track = (name, params) => window.gaEvent(name, params);
  const NW = D.weeks.length;
  const latest = g => { const s = D.regions[g]; return s ? s[NW - 1] : null; };
  const weekNow = D.weeks[NW - 1];

  // 지수 시계열 (regionsIndex가 없으면 변동률에서 누적 계산)
  function indexSeries(g) { // g === null 이면 서울 전체
    const idx = g ? (D.regionsIndex || {})[g] : D.seoulIndex;
    if (idx) return idx;
    const pct = g ? D.regions[g] : D.seoul;
    if (!pct) return null;
    let acc = 100; return pct.map(p => (p == null ? null : (acc *= 1 + p / 100)));
  }

  // ---------- 헤더 ----------
  document.getElementById("subtitle").innerHTML =
    `<b>주차</b> ${weekNow} · <b>출처</b> ${D.source}`;
  const seoulNow = D.seoul ? D.seoul[NW - 1] : null;
  const stat = document.getElementById("seoul-stat");
  stat.textContent = fmt(seoulNow) + "%";
  stat.style.color = seoulNow > 0.02 ? "var(--up-strong)" : seoulNow < -0.02 ? "var(--down-strong)" : "var(--ink)";

  if (D.isSample) {
    document.getElementById("sample-banner").innerHTML =
      `<div class="sample-note">지금 보이는 값은 <b>샘플 데이터</b>입니다. R-ONE 인증키를 <code>.env</code>에 넣고
       <code>python scripts/fetch_data.py</code> 를 실행하면 실제 최신 주간 데이터로 바뀝니다.</div>`;
  }

  // 요약 칩
  const gus = Object.keys(D.regions);
  const allGus = GEO.features.map(f => f.properties.SIG_KOR_NM);
  const up = gus.filter(g => latest(g) > 0.02).length;
  const down = gus.filter(g => latest(g) < -0.02).length;
  const flat = gus.filter(g => { const v = latest(g); return v != null && v >= -0.02 && v <= 0.02; }).length;
  const none = allGus.filter(g => latest(g) == null).length;
  document.getElementById("chips").innerHTML = [
    `<span class="chip"><span class="dot" style="background:#dd4a41"></span>상승 <b>${up}</b></span>`,
    `<span class="chip"><span class="dot" style="background:#c3c2b7"></span>보합 <b>${flat}</b></span>`,
    `<span class="chip"><span class="dot" style="background:#2a78d6"></span>하락 <b>${down}</b></span>`,
    none ? `<span class="chip">자료 없음 <b>${none}</b></span>` : "",
  ].join("");

  // ---------- 범례 ----------
  document.getElementById("legend-cells").innerHTML =
    BINS.map(b => `<span style="background:${b.fill}" title="${b.label}"></span>`).join("");
  document.getElementById("legend-ticks").innerHTML =
    ["-0.40", "-0.25", "-0.10", "-0.02", "+0.02", "+0.10", "+0.25", "+0.40"]
      .map(t => `<span>${t}</span>`).join("");

  // ---------- 지도 ----------
  const svg = document.getElementById("map");
  const NS = "http://www.w3.org/2000/svg";

  let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
  GEO.features.forEach(f => f.geometry.coordinates.forEach(ring => ring.forEach(([x, y]) => {
    if (x < minLon) minLon = x; if (x > maxLon) maxLon = x;
    if (y < minLat) minLat = y; if (y > maxLat) maxLat = y;
  })));
  const midLat = (minLat + maxLat) / 2, cosL = Math.cos(midLat * Math.PI / 180);
  const PAD = 26, W = 940;
  const k = (W - PAD * 2) / ((maxLon - minLon) * cosL);
  const H = Math.ceil((maxLat - minLat) * k + PAD * 2);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const px = lon => PAD + (lon - minLon) * cosL * k;
  const py = lat => PAD + (maxLat - lat) * k;

  svg.innerHTML = `<defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#f3f2ef"></rect>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#d8d7d0" stroke-width="2.2"></line>
    </pattern>
    <pattern id="hatch-mini" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f3f2ef"></rect>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d8d7d0" stroke-width="2"></line>
    </pattern>
  </defs>`;

  const gView = document.createElementNS(NS, "g");
  const gShapes = document.createElementNS(NS, "g");
  const gLabels = document.createElementNS(NS, "g");
  const gLocation = document.createElementNS(NS, "g");
  gLocation.setAttribute("class", "location-marker");
  gLocation.style.display = "none";
  gLocation.innerHTML =
    '<circle class="loc-halo" cx="0" cy="0" fill="#ffffff" fill-opacity=".92"></circle>' +
    '<circle class="loc-dot" cx="0" cy="0" fill="#2563eb"></circle>';
  gView.appendChild(gShapes); gView.appendChild(gLabels); gView.appendChild(gLocation);
  svg.appendChild(gView);

  const tooltip = document.getElementById("tooltip");
  const districtPanel = document.getElementById("district-panel");
  const mapLayout = document.getElementById("map-layout");
  const desktopLayout = matchMedia("(min-width: 1024px)");
  const finePointer = matchMedia("(hover: hover) and (pointer: fine)");
  const locateButton = document.getElementById("locate-me");
  const locationStatus = document.getElementById("location-status");
  let userLocation = null;

  // ---------- 라벨 배치 ----------
  // 자치구 경계는 오목한 모양이 많아 무게중심(centroid)이 경계 밖이나 경계선 위에
  // 놓이는 경우가 있다. 대신 "가장 큰 내접원의 중심"(pole of inaccessibility)을
  // 화면 좌표계에서 구해 라벨을 경계에서 가장 먼 곳에 둔다.
  function segDist2(x, y, ax, ay, bx, by) {
    let dx = bx - ax, dy = by - ay;
    if (dx || dy) {
      const t = ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy);
      if (t > 1) { ax = bx; ay = by; }
      else if (t > 0) { ax += dx * t; ay += dy * t; }
    }
    dx = x - ax; dy = y - ay;
    return dx * dx + dy * dy;
  }

  function inRing(x, y, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  // 경계까지의 부호 있는 거리 (내부 +, 외부 -)
  function clearance(x, y, ring) {
    let m = Infinity;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const d = segDist2(x, y, ring[j][0], ring[j][1], ring[i][0], ring[i][1]);
      if (d < m) m = d;
    }
    return (inRing(x, y, ring) ? 1 : -1) * Math.sqrt(m);
  }

  const SQRT2 = Math.SQRT2;

  function polylabel(ring, precision) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const [x, y] of ring) {
      if (x < minX) minX = x; if (y < minY) minY = y;
      if (x > maxX) maxX = x; if (y > maxY) maxY = y;
    }
    const w = maxX - minX, h = maxY - minY;
    let cell = Math.min(w, h) / 2;
    if (cell === 0) return [minX, minY, 0];

    const mk = (x, y, half) => {
      const d = clearance(x, y, ring);
      return { x, y, h: half, d, max: d + half * SQRT2 };
    };
    // 우선순위 큐 대신, 남은 후보를 최대 상한(max) 기준으로 꺼내는 이진 힙
    const heap = [];
    const push = c => {
      heap.push(c);
      let i = heap.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (heap[p].max >= heap[i].max) break;
        [heap[p], heap[i]] = [heap[i], heap[p]]; i = p;
      }
    };
    const pop = () => {
      const top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1; let b = i;
          if (l < heap.length && heap[l].max > heap[b].max) b = l;
          if (r < heap.length && heap[r].max > heap[b].max) b = r;
          if (b === i) break;
          [heap[b], heap[i]] = [heap[i], heap[b]]; i = b;
        }
      }
      return top;
    };

    for (let x = minX; x < maxX; x += cell * 2)
      for (let y = minY; y < maxY; y += cell * 2) push(mk(x + cell, y + cell, cell));

    let best = mk(minX + w / 2, minY + h / 2, 0);
    while (heap.length) {
      const c = pop();
      if (c.d > best.d) best = c;
      if (c.max - best.d <= precision) continue;
      const half = c.h / 2;
      push(mk(c.x - half, c.y - half, half));
      push(mk(c.x + half, c.y - half, half));
      push(mk(c.x - half, c.y + half, half));
      push(mk(c.x + half, c.y + half, half));
    }
    return [best.x, best.y, best.d];
  }

  // 라벨 글상자가 경계 안에 들어가는지 확인하기 위한 텍스트 폭 측정
  const measureCtx = document.createElement("canvas").getContext("2d");
  const LABEL_FONT = getComputedStyle(document.body).fontFamily;
  function textWidth(s, size, weight) {
    measureCtx.font = `${weight} ${size}px ${LABEL_FONT}`;
    return measureCtx.measureText(s).width;
  }

  const NM_SIZE = 13, VAL_SIZE = 11, LINE_GAP = 14;
  const CAP = 10, DESC = 3, BOX_PAD = 2, EDGE_MARGIN = 1.5, MIN_SCALE = 0.72;
  const BADGE_H = 15, BADGE_GAP = 9, BADGE_SIZE = 10, BADGE_PAD = 12;

  // 내접원 중심에 라벨(청약 배지 + 이름 + 수치)을 세로 중앙 정렬하고,
  // 글상자가 경계를 넘으면 줄인다.
  function fitLabel(ring, cx, cy, nameText, valText, badgeText) {
    const nw = textWidth(nameText, NM_SIZE, 700);
    const vw = valText ? textWidth(valText, VAL_SIZE, 500) : 0;
    const bw = badgeText ? textWidth(badgeText, BADGE_SIZE, 700) + BADGE_PAD : 0;
    const halfW = Math.max(nw, vw, bw) / 2 + BOX_PAD;
    const top = -CAP - (badgeText ? BADGE_H + BADGE_GAP : 0);
    const bottom = valText ? LINE_GAP + DESC : DESC;
    const nameDy = -(top + bottom) / 2;

    const fits = sc => {
      const hw = halfW * sc, t = (top + nameDy) * sc, bot = (bottom + nameDy) * sc;
      for (const dx of [-1, 0, 1])
        for (const oy of [t, (t + bot) / 2, bot])
          if (clearance(cx + hw * dx, cy + oy, ring) < EDGE_MARGIN) return false;
      return true;
    };

    let sc = 1;
    while (sc > MIN_SCALE && !fits(sc)) sc -= 0.04;
    return { scale: Math.max(sc, MIN_SCALE), nameDy, top, badgeW: bw };
  }

  // 툴팁 스파크라인 (최근 52주 지수)
  function sparkline(g) {
    const s = indexSeries(g);
    if (!s) return "";
    const tail = s.slice(-52).filter(v => v != null);
    if (tail.length < 2) return "";
    const w = 160, h = 34, lo = Math.min(...tail), hi = Math.max(...tail), span = (hi - lo) || 1;
    const pts = tail.map((v, i) =>
      `${(i / (tail.length - 1) * w).toFixed(1)},${(h - 3 - (v - lo) / span * (h - 6)).toFixed(1)}`).join(" ");
    const rising = tail[tail.length - 1] >= tail[0];
    return `<div class="tt-spark"><div class="tt-spark-cap">최근 1년 지수 흐름</div>
      <svg width="${w}" height="${h}"><polyline points="${pts}" fill="none"
        stroke="${rising ? "#dd4a41" : "#2a78d6"}" stroke-width="1.8" stroke-linejoin="round"></polyline></svg></div>`;
  }

  // 툴팁 하단 청약 블록 (해당 자치구의 예정 · 접수중 건)
  function cheongyakBlock(g) {
    const list = cyOf(g);
    if (!list.length) return "";
    const md = d => (d ? esc(d).slice(5).replace("-", ".") : "–");
    const rows = list.slice(0, 3).map(c => {
      const status = c.begin && c.begin <= cyToday && (!c.end || cyToday <= c.end) ? "접수중" : "예정";
      return `
      <tr><td>${esc(c.name)}<span class="tt-sub">${esc(c.kind)}${c.households ? " · " + esc(c.households) + "세대" : ""}</span></td>
          <td>${md(c.begin)}~${md(c.end)}<span class="tt-flag${status === "접수중" ? " on" : ""}">${status}</span></td></tr>`;
    }).join("");
    const more = list.length > 3 ? `<div class="tt-more">외 ${list.length - 3}건</div>` : "";
    return `<div class="tt-cy"><div class="tt-cy-cap">청약 예정 · 접수중 ${list.length}건</div>
      <table>${rows}</table>${more}</div>`;
  }

  function districtInfoHtml(name) {
    const v = latest(name);
    const series = D.regions[name] || [];
    const rows = D.weeks.slice(-8).map((w, i) => {
      const val = series[NW - 8 + i];
      const bw = val == null ? 0 : Math.min(Math.abs(val) / 0.5 * 40, 40);
      const bc = val > 0.02 ? "#dd4a41" : val < -0.02 ? "#2a78d6" : "#c3c2b7";
      return `<tr><td>${w}</td><td>${fmt(val)}<span class="tt-bar" style="width:${bw}px;background:${bc}"></span></td></tr>`;
    }).join("");
    return `<div class="district-summary">
        <div class="district-summary-main">
          <div class="tt-name">${name}</div>
          <div class="tt-now" style="color:${v > 0.02 ? "var(--up-strong)" : v < -0.02 ? "var(--down-strong)" : "var(--ink)"}">${v == null ? "자료 없음" : fmt(v) + "%"}</div>
        </div>
        ${sparkline(name)}
      </div>
      <table>${rows}</table>
      ${cheongyakBlock(name)}`;
  }

  function renderDistrictPanel(name, scrollPanel = false) {
    if (!name) {
      districtPanel.dataset.open = "false";
      districtPanel.setAttribute("aria-hidden", "true");
      mapLayout.classList.remove("has-selection");
      districtPanel.innerHTML = "";
      return;
    }

    districtPanel.innerHTML =
      `<div class="district-panel-head">
         <div class="panel-cap">선택 자치구</div>
         <button type="button" class="panel-close" aria-label="${name} 상세정보 닫기">×</button>
       </div>${districtInfoHtml(name)}`;
    districtPanel.dataset.open = "true";
    districtPanel.setAttribute("aria-hidden", "false");
    mapLayout.classList.add("has-selection");

    const close = districtPanel.querySelector(".panel-close");
    if (close) close.onclick = () => selectGu(name);

    // 모바일/태블릿에서는 선택 정보가 지도 아래에 있으므로 필요한 만큼만 자연스럽게 노출한다.
    if (!desktopLayout.matches && scrollPanel) {
      requestAnimationFrame(() => districtPanel.scrollIntoView({ behavior: "smooth", block: "nearest" }));
    }
  }

  const pathByGu = {};
  const labelEls = [];

  GEO.features.forEach(f => {
    const name = f.properties.SIG_KOR_NM;
    const v = latest(name);
    const bin = binOf(v);

    const d = f.geometry.coordinates.map(ring =>
      "M" + ring.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join("L") + "Z"
    ).join("");
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "gu");
    path.setAttribute("fill", bin ? bin.fill : "url(#hatch)");
    path.setAttribute("tabindex", "0");
    path.setAttribute("role", "button");
    path.setAttribute("aria-label", `${name} ${v == null ? "자료 없음" : fmt(v) + "%"} — 클릭하면 상세 정보와 아래 차트에 고정 표시`);
    gShapes.appendChild(path);
    pathByGu[name] = path;

    const ringPx = f.geometry.coordinates[0].map(([x, y]) => [px(x), py(y)]);
    const [cx, cy] = polylabel(ringPx, 0.6);
    const ink = v == null ? "#898781" : bin.ink;
    const short = name.length > 2 ? name.slice(0, -1) : name;
    const valText = v == null ? "" : fmt(v);
    const cyCount = cyOf(name).length;
    const badgeText = cyCount ? `청약 ${cyCount}` : "";
    const { scale, nameDy, top, badgeW } = fitLabel(ringPx, cx, cy, short, valText, badgeText);
    const badgeInk = v == null ? "#ffffff" : bin.fill;
    const label = document.createElementNS(NS, "g");
    label.setAttribute("class", "gu-label");
    label.setAttribute("transform",
      `translate(${cx.toFixed(1)},${cy.toFixed(1)}) scale(${scale.toFixed(3)})`);
    label.innerHTML =
      (badgeText
        ? `<rect x="${(-badgeW / 2).toFixed(1)}" y="${(nameDy + top).toFixed(1)}" width="${badgeW.toFixed(1)}"
                 height="${BADGE_H}" rx="${BADGE_H / 2}" fill="${ink}"></rect>
           <text class="bdg-t" x="0" y="${(nameDy + top + BADGE_H - 4.5).toFixed(1)}" fill="${badgeInk}">${badgeText}</text>`
        : "") +
      `<text class="nm" x="0" y="${nameDy.toFixed(1)}" fill="${ink}">${short}</text>` +
      (valText ? `<text class="val" x="0" y="${(nameDy + LINE_GAP).toFixed(1)}" fill="${ink}">${valText}</text>` : "");
    gLabels.appendChild(label);
    labelEls.push({ el: label, cx, cy, s: scale });

    const show = (evt) => {
      tooltip.innerHTML = districtInfoHtml(name);
      tooltip.style.display = "block";
      move(evt);
    };
    const move = (evt) => {
      const m = 14, tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
      let x = evt.clientX + m, y = evt.clientY + m;
      if (x + tw > innerWidth - 8) x = evt.clientX - tw - m;
      if (y + th > innerHeight - 8) y = evt.clientY - th - m;
      tooltip.style.left = x + "px"; tooltip.style.top = y + "px";
    };
    const hide = () => { tooltip.style.display = "none"; };
    if (finePointer.matches) {
      path.addEventListener("mouseenter", show);
      path.addEventListener("mousemove", move);
      path.addEventListener("mouseleave", hide);
    }
    path.addEventListener("focus", () => {
      if (!finePointer.matches) return;
      const r = path.getBoundingClientRect();
      show({ clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 });
    });
    path.addEventListener("blur", hide);
    path.addEventListener("click", () => { if (!dragged()) selectGu(name); });
    path.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectGu(name); } });
  });

  // ---------- 지도 확대 · 이동 ----------
  const MIN_K = 1, MAX_K = 8;
  let zk = 1, tx = 0, ty = 0;
  const zoomIn = document.getElementById("zoom-in");
  const zoomOut = document.getElementById("zoom-out");
  const zoomReset = document.getElementById("zoom-reset");
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  function applyView() {
    // 1배율에서도 약간 이동 가능하게 두어 패닝 기능을 자연스럽게 발견할 수 있게 한다.
    // 확대할수록 여백 허용치는 작아져 지도 전체가 화면 밖으로 사라지지 않는다.
    const padX = W * 0.10 / zk;
    const padY = H * 0.08 / zk;
    tx = clamp(tx, W * (1 - zk) - padX, padX);
    ty = clamp(ty, H * (1 - zk) - padY, padY);
    gView.setAttribute("transform", `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${zk.toFixed(4)})`);
    svg.style.setProperty("--k", zk.toFixed(4));
    for (const l of labelEls) {
      l.el.setAttribute("transform",
        `translate(${l.cx.toFixed(1)},${l.cy.toFixed(1)}) scale(${(l.s / zk).toFixed(4)})`);
    }
    const zoomed = zk > MIN_K + 1e-6;
    svg.classList.toggle("pannable", zoomed);
    svg.style.cursor = "grab";
    zoomOut.disabled = !zoomed;
    zoomReset.disabled = !zoomed && Math.abs(tx) < 1 && Math.abs(ty) < 1;
    zoomIn.disabled = zk >= MAX_K - 1e-6;

    // 현재 위치 마커 크기는 확대 배율과 무관하게 화면에서 일정하게 유지한다.
    const halo = gLocation.querySelector(".loc-halo");
    const dot = gLocation.querySelector(".loc-dot");
    if (halo) halo.setAttribute("r", (8 / zk).toFixed(2));
    if (dot) dot.setAttribute("r", (4.5 / zk).toFixed(2));
  }

  function toView(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    return [(clientX - r.left) / r.width * W, (clientY - r.top) / r.height * H];
  }

  function zoomAt(factor, vx, vy) {
    const k2 = clamp(zk * factor, MIN_K, MAX_K);
    if (Math.abs(k2 - zk) < 1e-6) return;
    tx = vx - (vx - tx) * (k2 / zk);
    ty = vy - (vy - ty) * (k2 / zk);
    zk = k2;
    applyView();
  }

  function zoomCenter(factor) {
    zoomAt(factor, W / 2, H / 2);
    track("zoom_map", { level: +zk.toFixed(2) });
  }

  zoomIn.onclick = () => zoomCenter(1.6);
  zoomOut.onclick = () => zoomCenter(1 / 1.6);
  zoomReset.onclick = () => {
    zk = 1; tx = 0; ty = 0; applyView();
    track("zoom_map", { level: 1 });
  };

  svg.addEventListener("wheel", e => {
    if (!desktopLayout.matches || !finePointer.matches) return;
    e.preventDefault();
    const [vx, vy] = toView(e.clientX, e.clientY);
    zoomAt(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0022)), vx, vy);
  }, { passive: false });

  svg.addEventListener("dblclick", e => {
    if (!desktopLayout.matches || !finePointer.matches) return;
    e.preventDefault();
    const [vx, vy] = toView(e.clientX, e.clientY);
    zoomAt(1.6, vx, vy);
    track("zoom_map", { level: +zk.toFixed(2), input: "double_click" });
  });

  const pointers = new Map();
  let panFrom = null, pinchFrom = null, travel = 0;
  const dragged = () => travel > 6;

  function pinchOf() {
    const [a, b] = [...pointers.values()];
    return { d: Math.hypot(a[0] - b[0], a[1] - b[1]), mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 };
  }

  svg.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    travel = 0;
    tooltip.style.display = "none";
    if (pointers.size === 1) {
      panFrom = [e.clientX, e.clientY];
      if (e.pointerType !== "touch" || zk > MIN_K) svg.classList.add("panning");
    } else if (pointers.size === 2) {
      pinchFrom = pinchOf();
    }
  });

  addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    const r = svg.getBoundingClientRect();
    const sx = W / r.width, sy = H / r.height;

    if (pointers.size >= 2 && pinchFrom) {
      const now = pinchOf();
      tx += (now.mx - pinchFrom.mx) * sx;
      ty += (now.my - pinchFrom.my) * sy;
      applyView();
      if (pinchFrom.d > 0) {
        const [vx, vy] = toView(now.mx, now.my);
        zoomAt(now.d / pinchFrom.d, vx, vy);
      }
      pinchFrom = now;
      travel = Infinity;
      e.preventDefault();
    } else if (panFrom) {
      const dx = e.clientX - panFrom[0], dy = e.clientY - panFrom[1];
      travel += Math.abs(dx) + Math.abs(dy);
      panFrom = [e.clientX, e.clientY];

      if (e.pointerType === "touch" && zk <= MIN_K + 1e-6) {
        // 1배율 터치에서는 세로 페이지 스크롤을 살리고, 좌우 패닝만 제공한다.
        if (Math.abs(dx) > Math.abs(dy)) {
          tx += dx * sx;
          applyView();
          e.preventDefault();
        }
      } else {
        // 마우스/펜 또는 확대 상태에서는 1배율에서도 2차원 패닝.
        tx += dx * sx; ty += dy * sy;
        applyView();
        if (zk > MIN_K || e.pointerType !== "touch") e.preventDefault();
      }
    }
  }, { passive: false });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchFrom = null;
    if (pointers.size === 0) {
      panFrom = null;
      svg.classList.remove("panning");
    } else {
      panFrom = [...pointers.values()][0];
    }
  }
  addEventListener("pointerup", endPointer);
  addEventListener("pointercancel", endPointer);
  desktopLayout.addEventListener("change", () => {
    tooltip.style.display = "none";
    applyView();
  });
  applyView();

  // ---------- 표 보기 ----------
  const tableBox = document.getElementById("table-view");
  const rowsSorted = allGus
    .map(g => ({ g, v: latest(g), prev: (D.regions[g] || [])[NW - 2] ?? null }))
    .sort((a, b) => (b.v ?? -999) - (a.v ?? -999));
  const trendClass = v => v == null || Math.abs(v) < 0.005 ? "trend-flat" : v > 0 ? "trend-up" : "trend-down";
  tableBox.innerHTML = `<table>
    <thead><tr><th>자치구</th><th>${weekNow} (%)</th><th>전주 (%)</th><th>전주 대비</th></tr></thead>
    <tbody>${rowsSorted.map(r => {
      const bin = binOf(r.v);
      const delta = (r.v == null || r.prev == null) ? null : +(r.v - r.prev).toFixed(2);
      const arrow = delta == null ? "–" : delta > 0 ? "▲ +" + delta.toFixed(2) : delta < 0 ? "▼ " + Math.abs(delta).toFixed(2) : "―";
      return `<tr>
        <td class="swatch-cell"><span class="sw" style="background:${bin ? bin.fill : "#eceae5"}"></span>${r.g}</td>
        <td><span class="${trendClass(r.v)}">${fmt(r.v)}</span></td>
        <td><span class="${trendClass(r.prev)}">${fmt(r.prev)}</span></td>
        <td><span class="${trendClass(delta)}">${arrow}</span></td></tr>`;
    }).join("")}</tbody></table>`;

  const btnMap = document.getElementById("btn-map"), btnTable = document.getElementById("btn-table");
  function setView(map) {
    document.getElementById("map-layout").style.display = map ? "" : "none";
    tableBox.style.display = map ? "none" : "block";
    btnMap.setAttribute("aria-pressed", String(map));
    btnTable.setAttribute("aria-pressed", String(!map));
  }
  btnMap.onclick = () => { setView(true); track("change_view", { view: "map" }); };
  btnTable.onclick = () => { setView(false); track("change_view", { view: "table" }); };

  // ---------- 시계열 차트 ----------
  const chart = document.getElementById("chart");
  const chartTip = document.getElementById("chart-tip");
  let selGu = null;          // null = 서울 전체만
  let range = "2024";
  let customStart = null, customEnd = null;
  const customRange = document.getElementById("custom-range");
  const customRangeToggle = document.getElementById("custom-range-toggle");
  const rangeStartInput = document.getElementById("range-start");
  const rangeEndInput = document.getElementById("range-end");
  const applyRange = document.getElementById("apply-range");

  rangeStartInput.min = rangeEndInput.min = D.weeks[0];
  rangeStartInput.max = rangeEndInput.max = weekNow;
  rangeEndInput.value = weekNow;
  const defaultCustomStart = new Date(weekNow + "T00:00:00Z");
  defaultCustomStart.setFullYear(defaultCustomStart.getFullYear() - 1);
  rangeStartInput.value = defaultCustomStart.toISOString().slice(0, 10);

  function rangeBounds() {
    let start = D.weeks[0], end = weekNow;
    if (range === "1y") {
      const dt = new Date(weekNow + "T00:00:00Z");
      dt.setFullYear(dt.getFullYear() - 1);
      start = dt.toISOString().slice(0, 10);
    } else if (range === "2024") {
      start = "2024-01-01";
    } else if (range === "custom") {
      start = customStart || D.weeks[0];
      end = customEnd || weekNow;
    }
    let i0 = D.weeks.findIndex(w => w >= start);
    if (i0 < 0) i0 = 0;
    let i1 = D.weeks.findIndex(w => w > end);
    if (i1 < 0) i1 = NW;
    if (i1 <= i0) i1 = Math.min(NW, i0 + 1);
    return [i0, i1];
  }

  function setSelectedGu(name, { scrollPanel = false, trackEvent = false, updateUrl = true, openDetail = false } = {}) {
    selGu = name || null;
    Object.entries(pathByGu).forEach(([g, p]) => p.classList.toggle("selected", g === selGu));
    renderDistrictPanel(selGu, scrollPanel);
    renderChart();

    if (openDetail && selGu) {
      window.AptDetail?.openDistrict(selGu);
    } else {
      window.AptDetail?.close(false);
    }

    if (updateUrl) history.replaceState(null, "", selGu ? "#" + encodeURIComponent(selGu) : location.pathname);
    if (selGu && trackEvent) track("select_district", { district: selGu, week: weekNow });
  }

  function selectGu(name) {
    setSelectedGu(selGu === name ? null : name, {
      scrollPanel: true, trackEvent: true, openDetail: true
    });
  }

  document.querySelectorAll("#range-toggle button[data-range]").forEach(b => {
    b.addEventListener("click", () => {
      range = b.dataset.range;
      customRange.hidden = true;
      customRangeToggle.setAttribute("aria-expanded", "false");
      customRangeToggle.setAttribute("aria-pressed", "false");
      document.querySelectorAll("#range-toggle button[data-range]").forEach(x =>
        x.setAttribute("aria-pressed", String(x === b)));
      renderChart();
      track("change_range", { range });
    });
  });

  customRangeToggle.addEventListener("click", () => {
    const open = customRange.hidden;
    customRange.hidden = !open;
    customRangeToggle.setAttribute("aria-expanded", String(open));
  });

  applyRange.addEventListener("click", () => {
    let a = rangeStartInput.value, b = rangeEndInput.value;
    if (!a || !b) return;
    if (a > b) [a, b] = [b, a];
    customStart = a; customEnd = b;
    rangeStartInput.value = a; rangeEndInput.value = b;
    range = "custom";
    document.querySelectorAll("#range-toggle button[data-range]").forEach(x =>
      x.setAttribute("aria-pressed", "false"));
    customRangeToggle.setAttribute("aria-pressed", "true");
    customRange.hidden = true;
    customRangeToggle.setAttribute("aria-expanded", "false");
    renderChart();
    track("change_range", { range: "custom", start: a, end: b });
  });

  function renderChart() {
    const [i0, i1] = rangeBounds();
    const weeks = D.weeks.slice(i0, i1);
    const n = weeks.length;
    const CW = 940, CH = 270, L = 46, R = 70, T = 16, B = 28;
    chart.setAttribute("viewBox", `0 0 ${CW} ${CH}`);

    // 구간 시작 = 100 재기준
    function rebased(g) {
      const s = indexSeries(g);
      if (!s) return null;
      const win = s.slice(i0, i1);
      const base = win.find(v => v != null);
      if (base == null) return null;
      return win.map(v => (v == null ? null : v / base * 100));
    }
    const series = [];
    series.push({ name: "서울 전체", color: "var(--series-seoul)", vals: rebased(null), width: 1.6, dash: "" });
    if (selGu) series.push({ name: selGu, color: "var(--series-gu)", vals: rebased(selGu), width: 2.2, dash: "" });
    const active = series.filter(s => s.vals);

    let lo = Infinity, hi = -Infinity;
    active.forEach(s => s.vals.forEach(v => { if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; } }));
    if (!isFinite(lo)) { chart.innerHTML = ""; return; }
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;

    const X = i => L + (n === 1 ? 0 : i / (n - 1) * (CW - L - R));
    const Y = v => T + (hi - v) / (hi - lo) * (CH - T - B);

    // y 격자 + 눈금
    let inner = "";
    const ticks = 4;
    for (let t = 0; t <= ticks; t++) {
      const v = lo + (hi - lo) * t / ticks, y = Y(v).toFixed(1);
      inner += `<line x1="${L}" y1="${y}" x2="${CW - R}" y2="${y}" stroke="#e1e0d9" stroke-width="1"></line>
        <text x="${L - 8}" y="${+y + 3.5}" text-anchor="end" font-size="10.5" fill="#898781">${v.toFixed(1)}</text>`;
    }
    // 100 기준선
    if (lo < 100 && hi > 100) {
      inner += `<line x1="${L}" y1="${Y(100)}" x2="${CW - R}" y2="${Y(100)}" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="4,3"></line>`;
    }
    // x 눈금 (연/월 경계)
    let lastLab = "";
    for (let i = 0; i < n; i++) {
      const yearMode = n > 260;
      const lab = yearMode ? weeks[i].slice(0, 4) : weeks[i].slice(0, 7);
      if (lab !== lastLab) {
        lastLab = lab;
        const showEvery = n > 156 ? 6 : n > 78 ? 3 : n > 40 ? 2 : 1;
        const month = +lab.slice(5, 7) || 1;
        if (yearMode || (month - 1) % showEvery === 0) {
          inner += `<line x1="${X(i).toFixed(1)}" y1="${CH - B}" x2="${X(i).toFixed(1)}" y2="${CH - B + 4}" stroke="#c3c2b7"></line>
            <text x="${X(i).toFixed(1)}" y="${CH - B + 16}" text-anchor="middle" font-size="10.5" fill="#898781">${lab.replace("-", ".")}</text>`;
        }
      }
    }
    // 선
    const endLabels = [];
    active.forEach(s => {
      let dstr = "", pen = false;
      s.vals.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        dstr += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); pen = true;
      });
      inner += `<path d="${dstr}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linejoin="round"></path>`;
      for (let i = s.vals.length - 1; i >= 0; i--) {
        if (s.vals[i] != null) { endLabels.push({ y: Y(s.vals[i]), name: s.name, color: s.color }); break; }
      }
    });
    // 우측 끝 직접 라벨 (겹치면 밀어내기)
    endLabels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < endLabels.length; i++) {
      const gap = endLabels[i].y - endLabels[i - 1].y;
      if (gap < 14) endLabels[i].y = endLabels[i - 1].y + 14;
    }
    endLabels.forEach(l => {
      inner += `<text x="${CW - R + 6}" y="${l.y.toFixed(1)}" font-size="11.5" font-weight="600" fill="${l.color}" dominant-baseline="middle">${l.name}</text>`;
    });
    // 크로스헤어 레이어
    inner += `<line id="xhair" x1="0" y1="${T}" x2="0" y2="${CH - B}" stroke="#0b0b0b" stroke-width="1" stroke-dasharray="3,3" visibility="hidden"></line>
      <rect id="hit" x="${L}" y="${T}" width="${CW - L - R}" height="${CH - T - B}" fill="transparent"></rect>`;
    chart.innerHTML = inner;

    document.getElementById("chart-legend").innerHTML = series.map(s =>
      `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("") +
      (selGu ? "" : `<span style="color:var(--muted)">자치구 미선택</span>`);

    const hit = chart.querySelector("#hit"), xh = chart.querySelector("#xhair");
    hit.addEventListener("mousemove", evt => {
      const box = chart.getBoundingClientRect();
      const sx = (evt.clientX - box.left) * (CW / box.width);
      const i = Math.round((sx - L) / (CW - L - R) * (n - 1));
      if (i < 0 || i >= n) return;
      xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i));
      xh.setAttribute("visibility", "visible");
      chartTip.innerHTML = `<div class="w">${weeks[i]} 주</div>` + active.map(s =>
        `<div class="r"><span class="lg"><i style="background:${s.color}"></i>${s.name}</span><b>${s.vals[i] == null ? "–" : s.vals[i].toFixed(2)}</b></div>`).join("");
      chartTip.style.display = "block";
      let tx = evt.clientX + 14, ty = evt.clientY + 14;
      if (tx + chartTip.offsetWidth > innerWidth - 8) tx = evt.clientX - chartTip.offsetWidth - 14;
      chartTip.style.left = tx + "px"; chartTip.style.top = ty + "px";
    });
    hit.addEventListener("mouseleave", () => {
      xh.setAttribute("visibility", "hidden"); chartTip.style.display = "none";
    });
  }
  // ---------- 현재 위치 ----------
  function featureContainsLonLat(f, lon, lat) {
    const geom = f.geometry || {};
    const insidePolygon = rings =>
      Array.isArray(rings) && rings.length &&
      inRing(lon, lat, rings[0]) &&
      !rings.slice(1).some(ring => inRing(lon, lat, ring));
    if (geom.type === "Polygon") return insidePolygon(geom.coordinates);
    if (geom.type === "MultiPolygon") return geom.coordinates.some(insidePolygon);
    return false;
  }

  function districtAt(lon, lat) {
    const f = GEO.features.find(feature => featureContainsLonLat(feature, lon, lat));
    return f ? f.properties.SIG_KOR_NM : null;
  }

  function showUserLocation(lon, lat) {
    userLocation = { lon, lat };
    gLocation.setAttribute("transform", `translate(${px(lon).toFixed(1)},${py(lat).toFixed(1)})`);
    gLocation.style.display = "";
    applyView();
  }

  function locateUser({ recenter = false, select = true } = {}) {
    if (!("geolocation" in navigator)) {
      locationStatus.textContent = "현재 위치 사용 불가";
      return;
    }
    locationStatus.textContent = "위치 확인 중";
    navigator.geolocation.getCurrentPosition(pos => {
      const lon = pos.coords.longitude, lat = pos.coords.latitude;
      const gu = districtAt(lon, lat);
      if (!gu) {
        userLocation = { lon, lat };
        gLocation.style.display = "none";
        locationStatus.textContent = "현재 위치: 서울 외";
        if (select) setSelectedGu(null, { updateUrl: false });
        return;
      }
      showUserLocation(lon, lat);
      locationStatus.textContent = `현재 위치: ${gu}`;
      if (recenter) {
        // 현재 위치가 지도 중앙에 오도록 이동하되 기존 배율은 유지한다.
        tx = W / 2 - px(lon) * zk;
        ty = H / 2 - py(lat) * zk;
        applyView();
      }
      if (select) setSelectedGu(gu, { scrollPanel: false, trackEvent: false, updateUrl: false });
    }, () => {
      locationStatus.textContent = "위치 권한 없음";
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
  }

  locateButton.addEventListener("click", () => locateUser({ recenter: true, select: true }));

  // URL 해시로 초기 상태 지정: #강남구 또는 #강남구,all
  const hadExplicitHash = Boolean(location.hash.slice(1));
  (function initFromHash() {
    const raw = decodeURIComponent(location.hash.slice(1));
    if (!raw) { renderDistrictPanel(null); renderChart(); return; }
    const [gu, r] = raw.split(",");
    if (r && ["1y", "2024", "all"].includes(r)) {
      range = r;
      document.querySelectorAll("#range-toggle button[data-range]").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.range === r)));
    }
    if (gu && pathByGu[gu]) {
      selGu = gu;
      pathByGu[gu].classList.add("selected");
    }
    renderDistrictPanel(selGu, false);
    renderChart();
  })();

  // 공유 링크의 명시적 지역 선택이 없을 때만 첫 화면에서 현재 위치를 자동 확인한다.
  if (!hadExplicitHash) locateUser({ recenter: false, select: true });

  // ---------- 푸터 ----------
  document.getElementById("footer").innerHTML =
    `한국부동산원 R-ONE · 청약홈 · 전주 대비 변동률 기준`;
})();
</script>
</body>
</html>
